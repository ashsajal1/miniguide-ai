# pnpm 12: explicit build-script approval (replaces package.json "pnpm" field)
allowBuilds:
  prisma: true
  "@prisma/engines": true
  "@clerk/shared": false
  esbuild: false
  sharp: false
  unrs-resolver: false

publicHoistPattern:
  - "@prisma/*"
  - prisma

overrides:
  "@neondatabase/serverless": 0.10.2
